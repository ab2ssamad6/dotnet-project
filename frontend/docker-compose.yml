services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: lms-frontend:latest
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8080}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
