# Nginx config for the LMS SPA. Processed by the official image's envsubst templating on start,
# via docker-entrypoint.sh (PORT, API_UPSTREAM and NGINX_RESOLVER are substituted from the
# environment). Only those three are env vars — every other $name below is an nginx variable and
# survives envsubst untouched.

# Runtime DNS for the variable proxy_pass below. Derived from /etc/resolv.conf by the entrypoint.
resolver ${NGINX_RESOLVER} valid=10s;
resolver_timeout 5s;

server {
    # Managed platforms inject the port to bind; defaults to 80 for Compose/local runs.
    listen       ${PORT};
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip for text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API location. Held in a variable on purpose: with a literal, nginx resolves the name
    # once while loading the config and refuses to start if it does not resolve yet — which is how
    # a Railway `*.railway.internal` upstream turns into a boot crash-loop.
    set $api_upstream ${API_UPSTREAM};

    # Long-cache hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy API calls to the backend so the browser stays same-origin.
    location /api/ {
        proxy_pass         $api_upstream$request_uri;
        proxy_http_version 1.1;
        # $proxy_host, not $host: a public upstream (https://<api>.up.railway.app) is routed by the
        # edge proxy on Host, and forwarding this server's own Host there yields a 404.
        proxy_set_header   Host              $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # This container's own health check — answered locally so a cold or still-migrating backend
    # cannot fail the SPA's deploy. Probe the backend's own /health through its domain instead.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"healthy"}';
    }

    # SPA fallback — every other route serves index.html. It must never be cached: the document
    # names the hashed asset files, so a stale copy asks for chunks a redeploy already deleted.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
