name: Publish frontend image

# Builds frontend/Dockerfile and pushes it to the GitHub Container Registry, ready for Railway to pull.
# See frontend/README.md → "Deploy to Railway".

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires an all-lowercase name; repository owners are already lowercase.
  IMAGE_NAME: ${{ github.repository_owner }}/lms-frontend

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided automatically by Actions; no secret to configure.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          # Railway runs x86-64; building only amd64 keeps the job fast.
          platforms: linux/amd64
          push: true
          # VITE_API_BASE_URL stays empty on purpose: the SPA calls same-origin /api and the
          # bundled Nginx proxies it to $API_UPSTREAM, so one image works on any backend host.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
